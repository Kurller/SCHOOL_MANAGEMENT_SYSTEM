services:

  app:

    build: .

    container_name: school_management

    ports:
      - "8000:80"

    volumes:
      - .:/var/www

    depends_on:
      - mysql



  mysql:

    image: mysql:8.0

    container_name: school_mysql

    restart: always


    environment:

      MYSQL_DATABASE: school_management

      MYSQL_USER: school_user

      MYSQL_PASSWORD: school_password

      MYSQL_ROOT_PASSWORD: root_password


    ports:

      - "3307:3306"


    volumes:

      - mysql_data:/var/lib/mysql



  phpmyadmin:

    image: phpmyadmin/phpmyadmin

    container_name: school_phpmyadmin


    ports:

      - "8081:80"


    environment:

      PMA_HOST: mysql


    depends_on:

      - mysql



volumes:

  mysql_data: